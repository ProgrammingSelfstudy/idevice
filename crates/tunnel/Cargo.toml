[package]
name = "tunnel"
version = "0.1.0"
edition.workspace = true

[dependencies]
usbmuxd = { path = "../usbmuxd" }
lockdownd = { path = "../lockdownd" }
pairing = { path = "../pairing" }
tokio = { workspace = true, features = ["sync", "time"] }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tracing = { workspace = true }
tokio-rustls = "0.26"
rustls-pki-types = "1"
smoltcp = { version = "0.14.0", default-features = false, features = ["std", "medium-ip", "proto-ipv6", "socket-tcp", "log"] }

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
