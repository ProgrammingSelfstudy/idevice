[package]
name = "instruments-cli"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "idevice-instruments"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
plist = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = "1"
usbmuxd = { path = "../usbmuxd" }
pairing = { path = "../pairing" }
tunnel = { path = "../tunnel" }
rsd = { path = "../rsd" }
dtx = { path = "../dtx" }
